user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Log format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # =========================================================================
    # BẢO MẬT TOÀN DIỆN (SECURITY HARDENING)
    # =========================================================================
    # 1. Ẩn thông tin phiên bản Nginx
    server_tokens off;

    # 2. Gzip Compression (Giúp nén dữ liệu bản đồ 7MB xuống còn ~1.2MB)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # =====================================================================
        # SECURITY HEADERS
        # =====================================================================
        # Chống Clickjacking
        add_header X-Frame-Options "SAMEORIGIN" always;
        # Chống MIME-sniffing
        add_header X-Content-Type-Options "nosniff" always;
        # Kích hoạt XSS Protection
        add_header X-XSS-Protection "1; mode=block" always;
        # Giới hạn thông tin Referrer
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Hạn chế quyền truy cập phần cứng thiết bị
        add_header Permissions-Policy "camera=(), microphone=(), payment=()" always;
        # Content Security Policy (CSP) cho phép CDN GIS uy tín và tiles bản đồ
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net https://cdn.sheetjs.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' data: blob: https://*.google.com https://*.googleapis.com https://*.gstatic.com https://*.cartocdn.com https://*.fastly.net https://*.openstreetmap.org https://*.openstreetmap.fr https://server.arcgisonline.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; connect-src 'self' https://*;" always;

        # Trang chính
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Cache tài nguyên tĩnh (JS, CSS, Ảnh)
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # =====================================================================
        # CHẶN TRUY CẬP CÁC FILE NHẠY CẢM
        # =====================================================================
        # Chặn các file ẩn (.git, .env...)
        location ~ /\.(?!well-known).* {
            deny all;
            return 404;
        }

        # Chặn tuyệt đối tải các file mã nguồn, file thô nếu vô tình có mặt
        location ~* \.(xlsx|xls|py|sh|bat|md)$ {
            deny all;
            return 404;
        }

        # Xử lý trang lỗi
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
